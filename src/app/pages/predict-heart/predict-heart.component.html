<div
  class="min-h-screen flex flex-col items-center justify-center"
>
  <!-- 🫀 Heart Disease Prediction Form -->
  <form
    [formGroup]="heartForm"
    (ngSubmit)="onSubmit()"
    class="max-w-4xl mx-auto p-6 bg-white shadow-2xl rounded-2xl border-l-4 border-[#673AB7] space-y-6"
  >
    <h2 class="text-2xl font-bold text-center text-gray-800">
      ❤️ Heart Disease Prediction
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <ng-container *ngFor="let control of heartForm.controls | keyvalue">
        <div
          class="flex flex-col gap-1 p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-all duration-300"
        >
          <label
            [for]="control.key"
            class="capitalize font-semibold text-gray-700 tracking-wide"
          >
            {{ formatLabel(control.key) }}
          </label>

          <!-- Handle different input types -->
          <ng-container [ngSwitch]="control.key">
            <!-- Radio buttons -->
            <ng-container *ngSwitchCase="'Sex'">
              <div class="mt-2 flex items-center space-x-4">
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="1"
                    class="form-radio"
                  />
                  <span class="ml-2">Male</span></label
                >
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="0"
                    class="form-radio"
                  />
                  <span class="ml-2">Female</span></label
                >
              </div>
            </ng-container>
            <ng-container *ngSwitchCase="'FastingBS'">
              <div class="mt-2 flex items-center space-x-4">
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="1"
                    class="form-radio"
                  />
                  <span class="ml-2">True (> 120 mg/dl)</span></label
                >
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="0"
                    class="form-radio"
                  />
                  <span class="ml-2">False (<= 120 mg/dl)</span></label
                >
              </div>
            </ng-container>
            <ng-container *ngSwitchCase="'ExerciseAngina'">
              <div class="mt-2 flex items-center space-x-4">
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="1"
                    class="form-radio"
                  />
                  <span class="ml-2">Yes</span></label
                >
                <label class="inline-flex items-center"
                  ><input
                    type="radio"
                    [formControlName]="control.key"
                    [value]="0"
                    class="form-radio"
                  />
                  <span class="ml-2">No</span></label
                >
              </div>
            </ng-container>

            <!-- Selects -->
            <ng-container *ngSwitchCase="'ChestPainType'">
              <select
                [id]="control.key"
                [formControlName]="control.key"
                class="mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
              >
                <option [value]="null" disabled>Select Chest Pain Type</option>
                <option [value]="0">Typical Angina</option>
                <option [value]="1">Atypical Angina</option>
                <option [value]="2">Non-anginal Pain</option>
                <option [value]="3">Asymptomatic</option>
              </select>
            </ng-container>
            <ng-container *ngSwitchCase="'RestingECG'">
              <select
                [id]="control.key"
                [formControlName]="control.key"
                class="mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
              >
                <option [value]="null" disabled>Select Resting ECG</option>
                <option [value]="0">Normal</option>
                <option [value]="1">ST-T wave abnormality</option>
                <option [value]="2">
                  Probable or definite left ventricular hypertrophy
                </option>
              </select>
            </ng-container>
            <ng-container *ngSwitchCase="'ST_Slope'">
              <select
                [id]="control.key"
                [formControlName]="control.key"
                class="mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
              >
                <option [value]="null" disabled>Select ST Slope</option>
                <option [value]="0">Upsloping</option>
                <option [value]="1">Flat</option>
                <option [value]="2">Downsloping</option>
              </select>
            </ng-container>
            <ng-container *ngSwitchCase="'thal'">
              <select
                [id]="control.key"
                [formControlName]="control.key"
                class="mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
              >
                <option [value]="null" disabled>Select Thalassemia</option>
                <option [value]="1">Normal</option>
                <option [value]="2">Fixed defect</option>
                <option [value]="3">Reversible defect</option>
              </select>
            </ng-container>

            <!-- Default to number input -->
            <ng-container *ngSwitchDefault>
              <input
                type="number"
                [id]="control.key"
                [formControlName]="control.key"
                class="mt-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                [placeholder]="'Enter ' + formatLabel(control.key)"
              />
            </ng-container>
          </ng-container>

          <!-- Validation Error Message -->
          <span
            *ngIf="control.value.invalid && control.value.touched"
            class="text-red-500 text-sm italic"
          >
            {{ formatLabel(control.key) }} is required.
          </span>
        </div>
      </ng-container>
    </div>

    <div class="text-center">
      <button
        type="submit"
        [disabled]="heartForm.invalid"
        class="mt-4 w-full md:w-auto bg-[#78D5E3] text-white font-semibold px-8 py-3 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition-transform duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        🔍 Predict Heart Disease
      </button>
    </div>
  </form>

  <!-- 💬 FAQ Section -->
  <div class="max-w-4xl mx-auto mt-12">
    <h3 class="text-2xl font-semibold text-gray-800 mb-6">
      ❓ Frequently Asked Questions
    </h3>

    <div
      *ngFor="let faq of faqs; let i = index"
      class="border-b border-gray-300 mb-4"
    >
      <button
        (click)="toggleFAQ(i)"
        class="w-full text-left flex justify-between items-center py-3 px-4 rounded-md hover:bg-gray-100 transition-all duration-200"
      >
        <span class="text-lg font-medium text-gray-800">{{
          faq.question
        }}</span>
        <svg
          [ngClass]="{ 'rotate-180': activeFAQ === i }"
          class="w-5 h-5 text-gray-600 transition-transform duration-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          ></path>
        </svg>
      </button>

      <div
        *ngIf="activeFAQ === i"
        class="px-4 pb-4 text-gray-700 text-lg duration-300"
      >
        {{ faq.answer }}
      </div>
    </div>
  </div>
</div>
