<header class="fixed top-0 left-0 w-full bg-[#052649] text-white shadow z-50">
  <div class="container mx-auto px-4 py-4">
    <div class="flex justify-between items-center">
      <!-- Logo and Brand -->
      <div class="flex items-center space-x-3">
        <img
          src="/logo.png"
          alt="Health App Logo"
          class="w-10 h-10 rounded-full object-cover"
        />
        <a routerLink="/" class="text-2xl font-bold font-sans">PreventWise</a>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <a routerLink="/" class="hover:text-blue-400 transition-colors">Home</a>
        <a routerLink="/about" class="hover:text-blue-400 transition-colors"
          >About</a
        >
        <a
          routerLink="/predict/diabetes"
          class="hover:text-blue-400 transition-colors"
          >Diabetes</a
        >
        <a
          routerLink="/predict/heart"
          class="hover:text-blue-400 transition-colors"
          >Heart</a
        >
        <a
          routerLink="/predict/stroke"
          class="hover:text-blue-400 transition-colors"
          >Stroke</a
        >
        <a routerLink="/contact" class="hover:text-blue-400 transition-colors"
          >Contact</a
        >

        <!-- User Dropdown -->
        <div class="relative user-dropdown">
          <button
            (click)="toggleUserDropdown()"
            class="flex items-center space-x-2 p-2 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
            <span class="text-sm font-medium">
              {{ authService.isLoggedIn() ? "Profile" : "Account" }}
            </span>
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div
            *ngIf="isUserDropdownOpen"
            (click)="$event.stopPropagation()"
            class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50"
          >
            <!-- For logged out users -->
            <ng-container *ngIf="!authService.isLoggedIn()">
              <a
                routerLink="/login"
                (click)="closeUserDropdown()"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                Login
              </a>
              <a
                routerLink="/signup"
                (click)="closeUserDropdown()"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                Sign Up
              </a>
            </ng-container>

            <!-- For logged in users -->
            <ng-container *ngIf="authService.isLoggedIn()">
              <a
                routerLink="/profile"
                (click)="closeUserDropdown()"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                Profile
              </a>
              <button
                (click)="logout()"
                class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors"
              >
                Logout
              </button>
            </ng-container>
          </div>
        </div>
      </nav>

      <!-- Mobile Menu Button -->
      <button
        (click)="toggleMenu()"
        class="md:hidden focus:outline-none"
        aria-label="Toggle menu"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            *ngIf="!isMenuOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
          <path
            *ngIf="isMenuOpen"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <nav [class.hidden]="!isMenuOpen" class="md:hidden mt-4 space-y-2">
      <a
        routerLink="/"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >Home</a
      >
      <a
        routerLink="/about"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >About</a
      >
      <a
        routerLink="/predict/diabetes"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >Diabetes</a
      >
      <a
        routerLink="/predict/heart"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >Heart</a
      >
      <a
        routerLink="/predict/stroke"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >Stroke</a
      >
      <a
        routerLink="/contact"
        (click)="closeMenu()"
        class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
        >Contact</a
      >

      <!-- Mobile Auth Links -->
      <div class="pt-4 border-t border-gray-700">
        <ng-container *ngIf="!authService.isLoggedIn()">
          <a
            routerLink="/login"
            (click)="closeMenu()"
            class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
            >Login</a
          >
          <a
            routerLink="/signup"
            (click)="closeMenu()"
            class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
            >Sign Up</a
          >
        </ng-container>
        <ng-container *ngIf="authService.isLoggedIn()">
          <a
            routerLink="/profile"
            (click)="closeMenu()"
            class="block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
            >Profile</a
          >
          <button
            (click)="logout()"
            class="w-full text-left block py-2 px-4 hover:bg-blue-700 rounded-lg transition-colors"
          >
            Logout
          </button>
        </ng-container>
      </div>
    </nav>
  </div>
</header>
<!-- Spacer to prevent content from hiding under fixed header -->
<div class="h-20"></div>
