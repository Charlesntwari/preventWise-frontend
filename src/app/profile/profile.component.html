<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Your Prediction History</h1>

  <div *ngIf="loading" class="text-center">
    <p class="text-gray-600">Loading history...</p>
  </div>

  <div *ngIf="error" class="p-4 text-center text-red-700 bg-red-100 rounded-lg">
    <p>{{ error }}</p>
  </div>

  <div
    *ngIf="!loading && !error && predictionHistory.length > 0"
    class="overflow-x-auto bg-white rounded-lg shadow"
  >
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Date
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Prediction Type
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
          >
            Result
          </th>
          <!-- Add other relevant columns from your history data -->
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let record of predictionHistory">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            {{ record.timestamp | date : "medium" }}
          </td>
          <td
            class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 capitalize"
          >
            {{ record.prediction_type }}
          </td>
          <td
            class="px-6 py-4 whitespace-nowrap text-sm font-semibold"
            [ngClass]="{
              'text-red-600': record.prediction_value === 1,
              'text-green-600': record.prediction_value === 0
            }"
          >
            {{ record.prediction_result }}
          </td>
          <!-- Render other data properties as needed -->
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="!loading && !error && predictionHistory.length === 0"
    class="text-center mt-8"
  >
    <p class="text-gray-500">You have no prediction history yet.</p>
  </div>
</div>
