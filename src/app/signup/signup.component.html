<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-center text-gray-900">
      Create an account
    </h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700"
          >Email address</label
        >
        <input
          id="email"
          type="email"
          formControlName="email"
          class="block w-full px-3 py-2 mt-1 placeholder-gray-400 border border-gray-300 rounded-md shadow-sm appearance-none focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="you@example.com"
        />
        <div
          *ngIf="
            signupForm.get('email')?.invalid && signupForm.get('email')?.touched
          "
          class="mt-1 text-sm text-red-600"
        >
          <span *ngIf="signupForm.get('email')?.errors?.['required']"
            >Email is required.</span
          >
          <span *ngIf="signupForm.get('email')?.errors?.['email']"
            >Please enter a valid email.</span
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700"
          >Password</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          class="block w-full px-3 py-2 mt-1 placeholder-gray-400 border border-gray-300 rounded-md shadow-sm appearance-none focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Password"
        />
        <div
          *ngIf="
            signupForm.get('password')?.invalid &&
            signupForm.get('password')?.touched
          "
          class="mt-1 text-sm text-red-600"
        >
          <span *ngIf="signupForm.get('password')?.errors?.['required']"
            >Password is required.</span
          >
          <span *ngIf="signupForm.get('password')?.errors?.['minlength']"
            >Password must be at least 6 characters.</span
          >
        </div>
      </div>

      <div>
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-gray-700"
          >Confirm Password</label
        >
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="block w-full px-3 py-2 mt-1 placeholder-gray-400 border border-gray-300 rounded-md shadow-sm appearance-none focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
          placeholder="Confirm Password"
        />
        <div
          *ngIf="
            signupForm.get('confirmPassword')?.invalid &&
            signupForm.get('confirmPassword')?.touched
          "
          class="mt-1 text-sm text-red-600"
        >
          <span *ngIf="signupForm.get('confirmPassword')?.errors?.['required']"
            >Confirming your password is required.</span
          >
          <span *ngIf="signupForm.get('confirmPassword')?.errors?.['mismatch']"
            >Passwords do not match.</span
          >
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="signupForm.invalid"
          class="w-full px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50"
        >
          Sign up
        </button>
      </div>
    </form>
    <p class="text-sm text-center text-gray-600">
      Already have an account?
      <a
        routerLink="/login"
        class="font-medium cursor-pointer text-indigo-600 hover:text-indigo-500"
        >Login</a
      >
    </p>
  </div>
</div>
